plugins {
    id 'java'
}

group = 'com.victor'
// Overridable from release CI with -PreleaseVersion=<x>; defaults to the base version for local builds.
version = (findProperty('releaseVersion') ?: '0.2.0').toString()

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    // Tests reference Montoya interface types directly (hand-built AuditIssue fakes, HttpRequest
    // proxies) without a running Burp instance, so — unlike the main jar — they need the API on
    // the runtime classpath too, not just compile-time.
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compile with any installed JDK >= 21 while still producing Java 21 bytecode.
    options.release = 21
}

// Keep archives byte-for-byte stable when inputs are identical. This also makes release checksums
// meaningful across rebuilds instead of changing because ZIP timestamps/order changed.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    archiveBaseName = 'burp-recon-hound'
    destinationDirectory = layout.buildDirectory.dir('libs')
    manifest {
        attributes(
            'Implementation-Title': archiveBaseName,
            'Implementation-Version': version,
            'Main-Class': 'com.victor.reconloop.ReconHoundCli'
        )
    }
}

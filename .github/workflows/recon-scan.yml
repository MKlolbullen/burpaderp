name: Recon Scan

# Offline analysis only: analyze a saved response body already in this checkout.
# Live target fetching is disabled until it can share the outbound gateway (#44).

on:
  workflow_dispatch:
    inputs:
      body_file:
        description: 'Repository path to a saved response body (no URL fetching)'
        required: true
      artifact_url:
        description: 'Original HTTP(S) URL used only as SARIF metadata'
        required: true
      content_type:
        description: 'Content type of the saved response body'
        default: 'text/html'
        required: false
      fail_on:
        description: 'Fail the run if a finding is at/above this severity'
        required: false
        default: 'high'
        type: choice
        options: [high, medium, low, none]

permissions:
  contents: read

concurrency:
  group: recon-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Analyze saved response
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: ./gradlew clean build --no-daemon

      - name: Analyze saved response with Recon Hound CLI
        env:
          FAIL_ON: ${{ inputs.fail_on }}
          BODY_FILE: ${{ inputs.body_file }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          CONTENT_TYPE: ${{ inputs.content_type }}
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'burp-recon-hound-*.jar' -print -quit)"
          java -jar "$JAR" --body-file "$BODY_FILE" --content-type "$CONTENT_TYPE" \
            --fail-on "$FAIL_ON" --output recon-hound.sarif "$ARTIFACT_URL"

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recon-hound-sarif
          path: recon-hound.sarif
          if-no-files-found: warn

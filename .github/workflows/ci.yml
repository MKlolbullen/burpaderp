name: CI

# Validate pull requests and every commit that lands on main. Stable publishing is handled separately
# by release.yml and only runs for explicit version tags.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and smoke-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: recon/go.mod
          cache: false

      - name: Test typed recon contracts
        working-directory: recon
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/reconctl ./cmd/reconctl

      # Build via the checked-in Gradle wrapper directly. gradle-wrapper.properties is the single
      # source of truth for the Gradle version and distribution checksum.
      - name: Build and test
        env:
          RECONCTL_TEST_BINARY: /tmp/reconctl
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Validate curated GF catalog and installer
        run: |
          python3 tools/gf/manage.py check
          python3 tools/gf/manage.py test-grep
          python3 -m unittest discover -s tools/gf/tests -v

      - name: Package and smoke-check passive recon sidecar
        run: |
          mkdir -p build/recon
          cp /tmp/reconctl build/recon/reconctl-linux-amd64
          /tmp/reconctl enumerate --help
          /tmp/reconctl workflow --help
          /tmp/reconctl chain --domain example.com > build/recon/example-chain.json

      - name: Test runtime verification receiver and offline comparison
        run: python3 -m unittest discover -s tools/runtime-verification/tests -v

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'burp-recon-hound-*.jar' -print -quit)"
          test -n "$JAR"
          # The CLI writes usage/help to stderr so bad invocations can share the same formatter.
          java -jar "$JAR" --help >/tmp/recon-hound-help.txt 2>&1
          grep -q -- '--fail-on' /tmp/recon-hound-help.txt
          printf '%s' '<html>offline fixture</html>' > /tmp/recon-hound-body.html
          java -jar "$JAR" --body-file /tmp/recon-hound-body.html --fail-on none \
            --output /tmp/recon-hound-offline.sarif https://does-not-resolve.invalid/
          test -s /tmp/recon-hound-offline.sarif
          status=0
          java -jar "$JAR" --fail-on none --output /tmp/recon-hound-blocked.sarif \
            https://does-not-resolve.invalid/ || status=$?
          test "$status" -eq 3
          test ! -e /tmp/recon-hound-blocked.sarif
          jar tf "$JAR" >/tmp/recon-hound-jar.txt
          grep -q '^com/victor/reconloop/ReconLoopExtension.class$' /tmp/recon-hound-jar.txt
          unzip -p "$JAR" gf-packs/GITLEAKS-LICENSE.txt | cmp - gf/GITLEAKS-LICENSE.txt
          # The manual harness has one extension entry point and is isolated from the production JAR.
          VERIFY_JAR=build/runtime-verification/recon-hound-runtime-verification.jar
          test -s "$VERIFY_JAR"
          jar tf "$VERIFY_JAR" >/tmp/recon-hound-runtime-jar.txt
          grep -q '^com/victor/reconloop/RuntimeVerificationExtension.class$' /tmp/recon-hound-runtime-jar.txt
          unzip -p "$VERIFY_JAR" gf-packs/GITLEAKS-LICENSE.txt | cmp - gf/GITLEAKS-LICENSE.txt
          if grep -q '^com/victor/reconloop/ReconLoopExtension.class$' /tmp/recon-hound-runtime-jar.txt; then exit 1; fi
          if grep -q '^com/victor/reconloop/RuntimeVerificationExtension.class$' /tmp/recon-hound-jar.txt; then exit 1; fi

      - name: Upload jar artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burp-recon-hound-jar-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/runtime-verification/*.jar
            build/recon/*
          if-no-files-found: error
          retention-days: 14

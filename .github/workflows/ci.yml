name: CI

# Validate pull requests and every commit that lands on main. Stable publishing is handled separately
# by release.yml and only runs for explicit version tags.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and smoke-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Build via the checked-in Gradle wrapper directly. gradle-wrapper.properties is the single
      # source of truth for the Gradle version and distribution checksum.
      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'burp-recon-hound-*.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" --help >/tmp/recon-hound-help.txt
          grep -q -- '--fail-on' /tmp/recon-hound-help.txt
          jar tf "$JAR" | grep -q '^com/victor/reconloop/ReconLoopExtension.class$'

      - name: Upload jar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burp-recon-hound-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

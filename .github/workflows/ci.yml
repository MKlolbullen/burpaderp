name: CI

# Validate pull requests and every commit that lands on main. Stable publishing is handled separately
# by release.yml and only runs for explicit version tags.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and smoke-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: recon/go.mod
          cache: false

      - name: Test typed recon contracts
        working-directory: recon
        run: |
          go test ./...
          go vet ./...

      # Build via the checked-in Gradle wrapper directly. gradle-wrapper.properties is the single
      # source of truth for the Gradle version and distribution checksum.
      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'burp-recon-hound-*.jar' -print -quit)"
          test -n "$JAR"
          # The CLI writes usage/help to stderr so bad invocations can share the same formatter.
          java -jar "$JAR" --help >/tmp/recon-hound-help.txt 2>&1
          grep -q -- '--fail-on' /tmp/recon-hound-help.txt
          jar tf "$JAR" >/tmp/recon-hound-jar.txt
          grep -q '^com/victor/reconloop/ReconLoopExtension.class$' /tmp/recon-hound-jar.txt

      - name: Upload jar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burp-recon-hound-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

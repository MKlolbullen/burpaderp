name: Release

# Stable releases are deliberate: push a SemVer-style tag such as v1.0.0. Main-branch commits are
# validated and uploaded as short-lived CI artifacts by ci.yml, but they do not create GitHub Releases.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and test release jar
        run: ./gradlew clean build --no-daemon --stacktrace -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Smoke-check packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          JAR="build/libs/burp-recon-hound-${VERSION}.jar"
          test -f "$JAR"
          java -jar "$JAR" --help >/tmp/recon-hound-help.txt
          grep -q -- '--fail-on' /tmp/recon-hound-help.txt
          jar tf "$JAR" | grep -q '^com/victor/reconloop/ReconLoopExtension.class$'
          sha256sum "$JAR" > "$JAR.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA_SHORT: ${{ steps.version.outputs.sha_short }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/burp-recon-hound-${VERSION}.jar"
          CHECKSUM="${JAR}.sha256"

          NOTES="$(mktemp)"
          {
            printf 'Recon Hound %s, built from commit `%s` using Java 21 and `montoya-api:2026.7`.\n\n' "$VERSION" "$SHA_SHORT"
            printf '**Install:** Burp Suite → Extensions → Installed → Add → Java → select `burp-recon-hound-%s.jar`.\n\n' "$VERSION"
            printf 'A SHA-256 checksum is attached alongside the JAR.\n'
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a failed workflow may reach this step after the release already exists.
            # Keep the immutable tag and replace only the generated assets.
            gh release upload "$TAG" "$JAR" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$JAR" "$CHECKSUM" \
              --title "Recon Hound ${VERSION}" \
              --notes-file "$NOTES" \
              --generate-notes
          fi
